name: Keep Repository Alive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update timestamp
        run: |
          echo "" >> README.md
          echo "<!-- Derniere activite automatique : $(date -u +"%Y-%m-%d %H:%M UTC") -->" >> README.md
      
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: keep repository active" || echo "Rien a committer"
          git push

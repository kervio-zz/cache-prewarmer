name: WordPress Cache Prewarmer

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  preload-cache:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Installation des dependances
        run: npm install
      
      - name: Purge du cache via SSH
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.SSH_PATH }} && wp cache flush --allow-root"
          rm /tmp/ssh_key
      
      - name: Attente apres purge
        run: sleep 5
      
      - name: Prechargement du cache
        run: node preload.js
